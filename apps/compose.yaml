name: warmhouse

x-security: &security
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-common: &common
  <<: *security
  init: true
  restart: unless-stopped

x-infra-depends: &infra-depends
  postgres: { condition: service_healthy }
  kafka: { condition: service_healthy }
  kafka-init: { condition: service_completed_successfully }

services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres-init/service-databases.sql:/docker-entrypoint-initdb.d/service-databases.sql:ro

    ports: [ "${POSTGRES_PUBLISH_PORT:-5432}:5432" ]
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1

    depends_on:
      kafka: { condition: service_healthy }

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in telemetry device-commands device-status; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
    restart: "no"

  temperature-api:
    <<: *common

    build:
      context: ./temperature-api
      dockerfile: Dockerfile

    ports: [ "${TEMPERATURE_API_PUBLISH_PORT:-8081}:8081" ]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *common

    build:
      context: ./smart_home
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/smarthome}
      TEMPERATURE_API_URL: ${TEMPERATURE_API_URL:-http://temperature-api:8081}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

    ports: [ "${APP_PUBLISH_PORT:-8080}:8080" ]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    depends_on:
      <<: *infra-depends
      temperature-api: { condition: service_started }

  device-service:
    <<: *common

    build:
      context: ./device-service
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: ${DEVICE_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/devices_db}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ROBYN_HOST: ${ROBYN_HOST:-0.0.0.0}
      ROBYN_PORT: ${ROBYN_PORT:-8082}

    tmpfs: [ "/tmp:size=64m,mode=1777,noexec,nosuid,nodev" ]
    ports: [ "${DEVICE_SERVICE_PUBLISH_PORT:-8082}:8082" ]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    depends_on: *infra-depends

  telemetry-service:
    <<: *common

    build:
      context: ./telemetry-service
      dockerfile: Dockerfile

    environment:
      DATABASE_JDBC_URL: ${TELEMETRY_DATABASE_JDBC_URL:-jdbc:postgresql://postgres:5432/telemetry_db}
      DATABASE_USER: ${TELEMETRY_DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${TELEMETRY_DATABASE_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KTOR_HOST: ${KTOR_HOST:-0.0.0.0}
      KTOR_PORT: ${KTOR_PORT:-8083}

    tmpfs: [ "/tmp:size=64m,mode=1777" ]
    ports: [ "${TELEMETRY_SERVICE_PUBLISH_PORT:-8083}:8083" ]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    depends_on: *infra-depends

volumes:
  postgres_data:
